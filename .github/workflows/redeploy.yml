name: Redeploy Nova

on:
  push:
    branches: [main]
    paths:
      - server/provision.mjs
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: redeploy-production
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Check out the docs site (gh-pages-src)
        uses: actions/checkout@v7
        with:
          repository: kaltura/intelligent-agents-sdk
          ref: gh-pages-src
          path: site

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - run: npm ci

      - name: Read existing resource ids from server/agent.json
        id: ids
        run: |
          echo "config-id=$(node -pe "JSON.parse(require('fs').readFileSync('server/agent.json')).configId")" >> "$GITHUB_OUTPUT"
          echo "agent-id=$(node -pe "JSON.parse(require('fs').readFileSync('server/agent.json')).agentId")" >> "$GITHUB_OUTPUT"
          echo "avatar-id=$(node -pe "JSON.parse(require('fs').readFileSync('server/agent.json')).avatarId")" >> "$GITHUB_OUTPUT"

      - name: Redeploy in place
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          node server/provision.mjs \
            --reuse "${{ steps.ids.outputs.config-id }}" \
            --agent-id "${{ steps.ids.outputs.agent-id }}" \
            --avatar-id "${{ steps.ids.outputs.avatar-id }}" \
            --site-dir ./site

      - name: Confirm server/agent.json is unchanged
        run: |
          # agent.json holds only stable ids (configId, avatarId, agentId, widgetId, tag).
          # The knowledge corpus is discovered live from the intellect, so a --reuse run
          # must rewrite the file byte-for-byte. A diff here means an id drifted; that is
          # a bug to fix, never state to commit back.
          if ! git diff --exit-code server/agent.json; then
            echo "::error::server/agent.json changed during a --reuse redeploy; stable ids must not drift"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Redeploy summary"
            echo "- configId: ${{ steps.ids.outputs.config-id }}"
            echo "- agentId: ${{ steps.ids.outputs.agent-id }}"
            echo "- avatarId: ${{ steps.ids.outputs.avatar-id }}"
            echo ""
            echo "provision.mjs discovers the intellect's current knowledge corpus live and compares"
            echo "the docs hash stored on its category with the docs in the site checkout. Same hash:"
            echo "the corpus is reused. Different hash: it is replaced, indexing is polled via"
            echo "\`kaltura.knowledge.entryStatus\`, and \`use_knowledge_base:'on'\` is written in the"
            echo "same intellect update (see docs/ARCHITECTURE.md). Nothing is committed back."
          } >> "$GITHUB_STEP_SUMMARY"
