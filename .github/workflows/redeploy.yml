name: Redeploy Nova

on:
  push:
    branches: [main]
    paths:
      - server/provision.mjs
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: redeploy-production
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Check out the docs site (gh-pages-src)
        uses: actions/checkout@v7
        with:
          repository: kaltura/intelligent-agents-sdk
          ref: gh-pages-src
          path: site

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Read existing resource ids from server/agent.json
        id: ids
        run: |
          echo "config-id=$(node -pe "JSON.parse(require('fs').readFileSync('server/agent.json')).configId")" >> "$GITHUB_OUTPUT"
          echo "agent-id=$(node -pe "JSON.parse(require('fs').readFileSync('server/agent.json')).agentId")" >> "$GITHUB_OUTPUT"
          echo "avatar-id=$(node -pe "JSON.parse(require('fs').readFileSync('server/agent.json')).avatarId")" >> "$GITHUB_OUTPUT"

      - name: Redeploy in place
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: |
          node server/provision.mjs \
            --reuse "${{ steps.ids.outputs.config-id }}" \
            --agent-id "${{ steps.ids.outputs.agent-id }}" \
            --avatar-id "${{ steps.ids.outputs.avatar-id }}" \
            --site-dir ./site

      - name: Open a PR with the updated server/agent.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet server/agent.json; then
            echo "agent.json unchanged"
            exit 0
          fi
          # main requires a PR + review for everyone, including this bot's own
          # GITHUB_TOKEN — it has no branch-protection-admin permission (nor
          # should it). Push the change to a new branch and open a PR instead
          # of pushing to main directly; a human merges it, same as any other
          # main-branch change.
          BRANCH="redeploy/agent-json-$(date -u +%Y%m%dT%H%M%SZ)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add server/agent.json
          git commit -m "Update server/agent.json after redeploy"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Sync server/agent.json after redeploy" \
            --body "Automated: server/agent.json changed after this run's redeploy. Merge to keep main in sync with the live agent."

      - name: Summary
        if: always()
        run: |
          {
            echo "### Redeploy summary"
            echo "- configId: ${{ steps.ids.outputs.config-id }}"
            echo "- agentId: ${{ steps.ids.outputs.agent-id }}"
            echo "- avatarId: ${{ steps.ids.outputs.avatar-id }}"
            echo ""
            echo "provision.mjs budgets a fixed best-effort wait for indexing BEFORE creating or"
            echo "updating the intellect this redeploy, then writes \`use_knowledge_base:'on'\` in"
            echo "that same call (see docs/ARCHITECTURE.md) — so the flip lands in a single write"
            echo "rather than a follow-up patch. There's no real per-entry completion signal yet"
            echo "(\`kaltura.knowledge.entryStatus\` isn't GA — general rollout expected early"
            echo "September 2026), so this is a timed wait, not a confirmed-ready check."
          } >> "$GITHUB_STEP_SUMMARY"
