name: Eval Nova

on:
  workflow_run:
    workflows: [Redeploy Nova]
    types: [completed]
  workflow_dispatch:
    inputs:
      trials:
        description: pass^k trial count (--trials)
        default: '1'

concurrency:
  group: eval
  cancel-in-progress: false

jobs:
  # No environment, so a skipped eval never waits for a production approval.
  gate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/download-artifact@v8
        if: ${{ github.event_name == 'workflow_run' }}
        with:
          name: eval-needed
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - id: decide
        run: |
          run=true
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "$(cat eval-needed.txt)" != "true" ]; then run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "run eval: $run"

  eval:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Check out the docs site (gh-pages-src)
        uses: actions/checkout@v7
        with:
          repository: kaltura/intelligent-agents-sdk
          ref: gh-pages-src
          path: site

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - run: npm ci

      - name: Check the knowledge base is fully indexed
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
        run: node server/provision.mjs --verify-knowledge

      - name: Run the eval against the live agent
        env:
          AGENTIC_PARTNER_ID: ${{ secrets.AGENTIC_PARTNER_ID }}
          AGENTIC_ADMIN_SECRET: ${{ secrets.AGENTIC_ADMIN_SECRET }}
          TRIALS: ${{ github.event.inputs.trials || '1' }}
        run: node tests/eval/run.mjs --site-dir ./site --trials "$TRIALS"

      - name: Publish report to job summary
        if: always()
        run: cat tests/eval/artifacts/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-artifacts
          path: tests/eval/artifacts/
          retention-days: 30
